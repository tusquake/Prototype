version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: finsop-postgres
    restart: always
    environment:
      POSTGRES_DB: finsop_db
      POSTGRES_USER: finsop_user
      POSTGRES_PASSWORD: finsop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsop_user -d finsop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: finsop-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: finsop_rabbit
      RABBITMQ_DEFAULT_PASS: finsop_rabbit_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsop-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsop_db
      SPRING_DATASOURCE_USERNAME: finsop_user
      SPRING_DATASOURCE_PASSWORD: finsop_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: finsop_rabbit
      SPRING_RABBITMQ_PASSWORD: finsop_rabbit_pass
      RATE_LIMITING_ENABLED: "true"
      RATE_LIMIT_STANDARD_CAPACITY: "100"
      RATE_LIMIT_STANDARD_REFILL_TOKENS: "100"
      RATE_LIMIT_STANDARD_REFILL_DURATION_MINUTES: "1"
      RATE_LIMIT_AUTH_CAPACITY: "10"
      RATE_LIMIT_AUTH_REFILL_TOKENS: "10"
      RATE_LIMIT_AUTH_REFILL_DURATION_MINUTES: "1"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/finsop/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React SPA Frontend (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsop-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3010:80"

volumes:
  postgres_data:
    driver: local
