version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: finsop-postgres
    restart: always
    environment:
      POSTGRES_DB: finsop_db
      POSTGRES_USER: finsop_user
      POSTGRES_PASSWORD: finsop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsop_user -d finsop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: finsop-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: finsop_rabbit
      RABBITMQ_DEFAULT_PASS: finsop_rabbit_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsop-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsop_db
      SPRING_DATASOURCE_USERNAME: finsop_user
      SPRING_DATASOURCE_PASSWORD: finsop_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: finsop_rabbit
      SPRING_RABBITMQ_PASSWORD: finsop_rabbit_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/finsop/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React SPA Frontend (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsop-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3010:80"

  # MinIO S3 Object Storage Container (Local Cloud Storage Alternative)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: finsop-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

