app:
  messaging:
    provider: rabbitmq

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/finsop_db
    driver-class-name: org.postgresql.Driver
    username: finsop_user
    password: finsop_password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false