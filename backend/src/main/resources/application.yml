server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/}

spring:
  application:
    name: finsop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

gcp:
  gcs:
    enabled: ${GCS_ENABLED:false}
    bucket-name: ${GCS_BUCKET_NAME:finsop-task-documents}
    project-id: ${GCP_PROJECT_ID:finsop-gcp-project}
    credentials-path: ${GCP_CREDENTIALS_PATH:}

app:
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${LOCAL_STORAGE_DIR:./storage_uploads}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3010,http://localhost:5173,https://storage.googleapis.com}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    standard:
      capacity: ${RATE_LIMIT_STANDARD_CAPACITY:100}
      refill-tokens: ${RATE_LIMIT_STANDARD_REFILL_TOKENS:100}
      refill-duration-minutes: ${RATE_LIMIT_STANDARD_REFILL_DURATION_MINUTES:1}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:10}
      refill-duration-minutes: ${RATE_LIMIT_AUTH_REFILL_DURATION_MINUTES:1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

