server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: finsop-backend
  profiles:
    active: local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3010,http://localhost:5173,https://storage.googleapis.com}
