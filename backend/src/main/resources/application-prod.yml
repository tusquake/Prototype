app:
  messaging:
    provider: pubsub
  cloud-run:
    self-url: ${APP_CLOUD_RUN_SELF_URL:https://fin-sop-backend-3b5udzmxha-el.a.run.app/finsop/v1/internal/tasks/process-single-template}

spring:
  config:
    activate:
      on-profile: prod

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:finance-sop-portal}
      pubsub:
        enabled: true
        topic:
          notification: ${GCP_PUBSUB_NOTIFICATION_TOPIC:finsop-notification-topic}
        subscription:
          notification: ${GCP_PUBSUB_NOTIFICATION_SUB:finsop-notification-sub}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsop_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql,classpath:db/migration

# Used directly by TaskSchedulerService (@Value bindings) — separate namespace
# from spring.cloud.gcp.* above, which is Spring Cloud GCP's own Pub/Sub config.
gcp:
  project-id: ${GCP_PROJECT_ID:finance-sop-portal}
  location-id: ${GCP_LOCATION_ID:asia-south1}
  cloud-tasks:
    queue-id: ${GCP_CLOUD_TASKS_QUEUE_ID:sop-instantiation-queue}
    invoker-service-account: ${GCP_CLOUD_TASKS_INVOKER_SA:fin-sop-tasks-sa@finance-sop-portal.iam.gserviceaccount.com}